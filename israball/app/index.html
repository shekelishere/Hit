<!doctype html>
<html lang="he" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Israball App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2F5450">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Israball">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<style>
/* Layout: one-column phone app on the bench-mat palette. Tabs: Test log (shop), Cart, My gadgets (return windows and warranties, the app's own job). */
:root {
  --paper: #F4F5F3; --sheet: #FFFFFF; --ink: #1D2327; --muted: #5E676B; --rule: #D8DCD8;
  --mat: #2F5450; --on-mat: #F1F4F2; --tape: #E2A23B; --on-tape: #1D2327; --short: #A4471F; --ok: #2F6B4F; --tab-on: #2F5450; --focus: #1F5FBF;
  --display: "Secular One", "Segoe UI", Arial, sans-serif;
  --body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --tabs-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121716; --sheet: #1A2120; --ink: #E6EBE9; --muted: #9AA6A3; --rule: #2C3634;
    --mat: #24423F; --on-mat: #ECF1EF; --tape: #E9B04E; --on-tape: #1D2327; --short: #F08A5D; --ok: #7BD3A5; --tab-on: #E9B04E; --focus: #7FB2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121716; --sheet: #1A2120; --ink: #E6EBE9; --muted: #9AA6A3; --rule: #2C3634;
  --mat: #24423F; --on-mat: #ECF1EF; --tape: #E9B04E; --on-tape: #1D2327; --short: #F08A5D; --ok: #7BD3A5; --tab-on: #E9B04E; --focus: #7FB2FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--mat); }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 520px; margin-inline: auto; min-height: 100%; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--mat); color: var(--on-mat); display: flex; align-items: center; gap: 10px; min-height: 54px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { font-family: var(--display); font-size: 1.5rem; line-height: 1; }
.bar .tools { margin-inline-start: auto; display: flex; gap: 6px; }
.seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--on-mat) 35%, transparent); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 9px; cursor: pointer; font-size: .82rem; color: var(--on-mat); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--on-mat); color: var(--mat); font-weight: 600; }
main { padding-block: 18px calc(var(--tabs-h) + 24px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.title { font-family: var(--display); font-size: 1.9rem; line-height: 1.1; }
.sub { color: var(--muted); margin-top: 4px; font-size: .95rem; }
.filters { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; padding-bottom: 4px; scrollbar-width: none; }
.filters button { flex: none; border: 1px solid var(--rule); background: var(--sheet); border-radius: 4px; padding: 6px 12px; cursor: pointer; min-height: 38px; font-size: .9rem; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.entries { list-style: none; padding: 0; margin: 14px 0 0; border-top: 2px solid var(--ink); }
.entry { padding-block: 16px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.entry h3 { font-size: 1.02rem; font-weight: 600; line-height: 1.35; }
.entry .note { color: var(--muted); font-size: .9rem; }
.reading { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; align-items: baseline; font-size: .9rem; }
.reading .what { color: var(--muted); min-width: 0; }
.reading .claimed { color: var(--muted); font-variant-numeric: tabular-nums; }
.reading .measured { font-weight: 600; font-variant-numeric: tabular-nums; }
.reading mark { background: var(--tape); color: var(--on-tape); padding: 0 4px; }
.reading .short { grid-column: 1 / -1; color: var(--short); font-size: .82rem; text-align: end; }
.reading .k { font-size: .75rem; color: var(--muted); display: block; font-weight: 400; }
.buyrow { display: flex; align-items: center; gap: 12px; }
.buyrow .price { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 1.08rem; }
.add { margin-inline-start: auto; background: var(--mat); color: var(--on-mat); border: 0; border-radius: 4px; padding: 9px 14px; font-weight: 600; cursor: pointer; min-height: 42px; }
.add[data-done="true"] { background: var(--ink); color: var(--paper); }

.btn { border: 0; border-radius: 4px; padding: 10px 16px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn-mat { background: var(--mat); color: var(--on-mat); }
.btn-tape { background: var(--tape); color: var(--on-tape); }
.btn-line { background: none; border: 1px solid var(--rule); }
.block { width: 100%; }

.lines { list-style: none; padding: 0; margin: 16px 0 0; border-top: 1px solid var(--rule); }
.lines li { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: center; }
.lines .nm { font-weight: 600; min-width: 0; }
.lines .lp { font-weight: 600; font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; gap: 8px; }
.qty button { width: 36px; height: 36px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 4px; cursor: pointer; }
.qty span { min-width: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 600; margin-top: 16px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); font-size: .88rem; }
.empty { margin-top: 24px; display: grid; gap: 12px; justify-items: start; color: var(--muted); }

.owned { list-style: none; padding: 0; margin: 16px 0 0; border-top: 1px solid var(--rule); }
.owned > li { padding-block: 16px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.owned h3 { font-size: 1.02rem; font-weight: 600; }
.dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: .88rem; }
.dates b { display: block; font-variant-numeric: tabular-nums; }
.window { height: 6px; background: color-mix(in srgb, var(--ink) 10%, transparent); border-radius: 3px; overflow: hidden; }
.window i { display: block; height: 100%; background: var(--mat); }
.window.low i { background: var(--tape); }
.state { font-size: .88rem; font-weight: 600; color: var(--ok); }
.state.wait { color: var(--ink); }
.ex { font-size: .78rem; color: var(--muted); }
.rform { display: grid; gap: 10px; margin-top: 6px; padding: 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); }
.rform fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
.rform legend { font-weight: 600; margin-bottom: 4px; }
.rform label { display: flex; gap: 8px; align-items: center; min-height: 36px; }
.rform .err { color: var(--short); font-size: .85rem; }
.rform .acts { display: flex; gap: 8px; }
.rform .acts .btn { flex: 1; }

.tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 25; background: var(--sheet); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 520px; margin-inline: auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabs-h); }
.tabs button { background: none; border: 0; cursor: pointer; display: grid; place-items: center; padding: 6px 0; color: var(--muted); font-size: .76rem; position: relative; }
.tabs svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--tab-on); font-weight: 600; }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; inset-inline: 30%; height: 3px; background: var(--tab-on); }
.badge { position: absolute; top: 6px; inset-inline-end: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 3px; background: var(--tape); color: var(--on-tape); font-size: .7rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.toast { position: fixed; inset-inline: 16px; bottom: calc(var(--tabs-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 35; max-width: 488px; margin-inline: auto; background: var(--ink); color: var(--paper); padding: 12px 14px; border-radius: 4px; font-size: .92rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>Israball</h1>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language"><button type="button" id="lang-he" aria-pressed="true">עב</button><button type="button" id="lang-en" aria-pressed="false">EN</button></div>
      <div class="seg" role="group" aria-label="Currency"><button type="button" id="cur-ils" aria-pressed="true">₪</button><button type="button" id="cur-usd" aria-pressed="false">$</button></div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

<div class="tabs">
  <nav aria-label="Main">
    <button type="button" data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span data-t="tabLog"></span></button>
    <button type="button" data-tab="cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2 11h10l2-8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.5" fill="currentColor"/><circle cx="17" cy="20" r="1.5" fill="currentColor"/></svg><span data-t="tabCart"></span><span class="badge" id="badge" hidden></span></button>
    <button type="button" data-tab="mine"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10h4M8 14h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-t="tabMine"></span></button>
  </nav>
</div>
<div class="toast" id="toast" role="status" hidden></div>

  function nf(v) { return v.toLocaleString(state.lang === "he" ? "he-IL" : "en-US"); }
  function money(ils) { if (state.cur === "usd") return "$" + Math.round(ils / USD_RATE); return state.lang === "he" ? nf(ils) + " ₪" : "₪" + nf(ils); }
  function unit(v, u) { return '<bdi dir="ltr">' + nf(v) + (u ? " " + u : "") + "</bdi>"; }
  function byId(id) { return PRODUCTS.filter(function (p) { return p.id === id; })[0]; }
  function addDays(iso, d) { var x = new Date(iso + "T12:00:00"); x.setDate(x.getDate() + d); return x; }
  function addMonths(iso, m) { var x = new Date(iso + "T12:00:00"); x.setMonth(x.getMonth() + m); return x; }
  function fmt(d) { if (typeof d === "string") d = new Date(d + "T12:00:00"); return d.toLocaleDateString(state.lang === "he" ? "he-IL" : "en-GB", { day: "numeric", month: "short", year: "numeric" }); }
  function save() { store.set("cart", state.cart); store.set("owned", state.owned); }
  function toast(m) { var el = $("#toast"); el.textContent = m; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { el.hidden = true; }, 3400); }

  function logScreen() {
    var h = '<h2 class="title">' + t("logTitle") + '</h2><p class="sub">' + t("logSub") + '</p><div class="filters" role="group" aria-label="' + t("tabLog") + '">' +
      ["all", "power", "home", "car", "tools"].map(function (c) { return '<button type="button" data-cat="' + c + '" aria-pressed="' + (state.cat === c) + '">' + t(c) + '</button>'; }).join("") + '</div>';
    h += '<ul class="entries">' + PRODUCTS.filter(function (p) { return state.cat === "all" || p.cat === state.cat; }).map(function (p) {
      var pct = Math.round((1 - p.meas / p.claim) * 100), short = !p.exact && !p.lossOk && pct >= 5;
      return '<li class="entry" data-id="' + p.id + '"><h3>' + p.name[state.lang] + '</h3>' +
        '<div class="reading"><span class="what">' + p.test[state.lang] + '</span><span class="claimed"><span class="k">' + t("claimed") + '</span>' + unit(p.claim, p.unit) + '</span><span class="measured"><span class="k">' + t("measured") + '</span><mark>' + unit(p.meas, p.unit) + '</mark></span>' +
        (short ? '<span class="short">' + t("short")(pct) + '</span>' : '') + '</div>' +
        '<p class="note">' + p.note[state.lang] + '</p>' +
        '<div class="buyrow"><span class="price">' + money(p.price) + '</span><button type="button" class="add" data-add>' + t("add") + '</button></div></li>';
    }).join("") + '</ul>';
    return h;
  }

  function cartScreen() {
    var h = '<h2 class="title">' + t("cartTitle") + '</h2>';
    if (!state.cart.length) return h + '<div class="empty"><p>' + t("cartEmpty") + '</p><button type="button" class="btn btn-mat" data-go="log">' + t("toLog") + '</button></div>';
    var tot = 0;
    h += '<ul class="lines">' + state.cart.map(function (l, i) {
      var p = byId(l.id); tot += p.price * l.q;
      return '<li><div class="nm">' + p.name[state.lang] + '</div><div class="lp">' + money(p.price * l.q) + '</div><div class="qty"><button type="button" data-q="-1" data-i="' + i + '" aria-label="' + t("less") + '">−</button><span>' + l.q + '</span><button type="button" data-q="1" data-i="' + i + '" aria-label="' + t("more") + '">+</button></div><div></div></li>';
    }).join("") + '</ul>';
    h += '<div class="total"><span>' + t("total") + '</span><span>' + money(tot) + '</span></div><p class="muted">' + t("totalNote") + (state.cur === "usd" ? " " + t("usdNote") : "") + '</p>';
    h += '<button type="button" class="btn btn-tape block" id="checkout" style="margin-top:16px">' + t("checkout") + '</button><p class="muted" id="checkout-note" hidden style="margin-top:10px">' + t("checkoutNote") + '</p>';
    return h;
  }

  function mineScreen() {
    var h = '<h2 class="title">' + t("mineTitle") + '</h2><p class="sub">' + t("mineSub") + '</p>';
    if (!state.owned.length) return h + '<div class="empty"><p>' + t("noneOwned") + '</p></div>';
    h += '<ul class="owned">' + state.owned.map(function (o) {
      var p = byId(o.id), end = addDays(o.date, RETURN_DAYS), left = Math.ceil((end - Date.now()) / 864e5), used = Math.min(1, Math.max(0, 1 - left / RETURN_DAYS));
      var s = '<li data-key="' + o.key + '"><h3>' + p.name[state.lang] + '</h3>' + (o.example ? '<span class="ex">' + t("example") + '</span>' : '') +
        '<div class="dates"><div>' + t("received") + '<b>' + fmt(o.date) + '</b></div><div>' + t("warrantyTo") + '<b>' + fmt(addMonths(o.date, WARRANTY_MONTHS)) + '</b></div></div>';
      if (o.ret) s += '<p class="state wait">' + t("pickupState") + '</p>';
      else if (left > 0) {
        s += '<div class="window' + (left <= 7 ? ' low' : '') + '" aria-hidden="true"><i style="width:' + ((1 - used) * 100).toFixed(0) + '%"></i></div><p class="state">' + t("daysLeft")(left) + '</p>';
        if (state.open === o.key) {
          s += '<form class="rform" data-form="' + o.key + '" novalidate><fieldset><legend>' + t("reasonLegend") + '</legend>' +
            ["rBroken", "rNotAsListed", "rChanged"].map(function (r, i) { return '<label><input type="radio" name="reason-' + o.key + '" id="r-' + o.key + '-' + i + '" value="' + r + '">' + t(r) + '</label>'; }).join("") +
            '</fieldset>' + (state.err ? '<p class="err" role="alert">' + t("reasonErr") + '</p>' : '') +
            '<div class="acts"><button type="button" class="btn btn-line" data-cancel>' + t("cancel") + '</button><button type="submit" class="btn btn-mat">' + t("sendReturn") + '</button></div></form>';
        } else s += '<button type="button" class="btn btn-line" data-return="' + o.key + '" style="justify-self:start">' + t("startReturn") + '</button>';
      } else s += '<p class="muted">' + t("windowClosed") + '</p>';
      return s + '</li>';
    }).join("") + '</ul>';
    return h;
  }

  function render(top) {
    var he = state.lang === "he";
    document.documentElement.lang = state.lang; document.documentElement.dir = he ? "rtl" : "ltr";
    $("#lang-he").setAttribute("aria-pressed", he); $("#lang-en").setAttribute("aria-pressed", !he);
    $("#cur-ils").setAttribute("aria-pressed", state.cur === "ils"); $("#cur-usd").setAttribute("aria-pressed", state.cur === "usd");
    $$("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    $$(".tabs [data-tab]").forEach(function (b) { if (b.getAttribute("data-tab") === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    var c = state.cart.reduce(function (a, l) { return a + l.q; }, 0); $("#badge").hidden = !c; $("#badge").textContent = c;
    $("#main").innerHTML = { log: logScreen, cart: cartScreen, mine: mineScreen }[state.tab]();
    if (top) { window.scrollTo(0, 0); $("#main").focus({ preventScroll: true }); }
  }
  function go(tab) { state.tab = tab; state.open = null; state.err = false; try { history.replaceState(null, "", "#" + tab); } catch (e) {} render(true); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null; if (!b) return;
    if (b.id === "lang-he" || b.id === "lang-en") { state.lang = b.id === "lang-he" ? "he" : "en"; store.set("lang", state.lang); render(); return; }
    if (b.id === "cur-ils" || b.id === "cur-usd") { state.cur = b.id === "cur-ils" ? "ils" : "usd"; store.set("cur", state.cur); render(); return; }
    if (b.hasAttribute("data-tab")) { go(b.getAttribute("data-tab")); return; }
    if (b.hasAttribute("data-go")) { go(b.getAttribute("data-go")); return; }
    if (b.hasAttribute("data-cat")) { state.cat = b.getAttribute("data-cat"); render(); return; }
    if (b.hasAttribute("data-add")) {
      var id = b.closest(".entry").getAttribute("data-id"), l = state.cart.filter(function (x) { return x.id === id; })[0];
      if (l) l.q++; else state.cart.push({ id: id, q: 1 }); save();
      var c = state.cart.reduce(function (a, x) { return a + x.q; }, 0); $("#badge").hidden = false; $("#badge").textContent = c;
      b.textContent = t("added"); b.setAttribute("data-done", "true"); setTimeout(function () { b.textContent = t("add"); b.removeAttribute("data-done"); }, 1400); return;
    }
    if (b.hasAttribute("data-q")) { var i = +b.getAttribute("data-i"); state.cart[i].q += +b.getAttribute("data-q"); if (state.cart[i].q <= 0) state.cart.splice(i, 1); save(); render(); return; }
    if (b.id === "checkout") { $("#checkout-note").hidden = false; return; }
    if (b.hasAttribute("data-return")) { state.open = b.getAttribute("data-return"); state.err = false; render(); var r = $("#r-" + state.open + "-0"); if (r) r.focus(); return; }
    if (b.hasAttribute("data-cancel")) { var k = state.open; state.open = null; state.err = false; render(); var rb = $('[data-return="' + k + '"]'); if (rb) rb.focus(); return; }
  });
  document.addEventListener("change", function (e) { if (e.target.type === "radio" && state.err) { state.err = false; var er = $(".rform .err"); if (er) er.remove(); } });
  document.addEventListener("submit", function (e) {
    e.preventDefault(); var key = e.target.getAttribute("data-form"); if (!key) return;
    var pick = e.target.querySelector("input[type=radio]:checked");
    if (!pick) { state.err = true; render(); var f = $("#r-" + key + "-0"); if (f) f.focus(); return; }
    var o = state.owned.filter(function (x) { return x.key === key; })[0]; o.ret = pick.value; state.open = null; save(); render(); toast(t("returnSaved"));
  });
  window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (["log", "cart", "mine"].indexOf(h) >= 0 && h !== state.tab) { state.tab = h; render(true); } });
  var start = location.hash.slice(1); if (["log", "cart", "mine"].indexOf(start) >= 0) state.tab = start;
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
