<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Israball App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#164F34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Israball">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Karantina:wght@400;700&display=swap">
<style>
/* Layout: one-column phone app. Pitch-green top bar, scrolling screen, fixed bottom tabs (Kids, Shop, Cart, Orders). The kids' measurement cards are the app's own feature. */
:root {
  --chalk: #F3F6F4; --surface: #FFFFFF; --ink: #10233A; --muted: #55665F; --rule: #D3DDD8;
  --pitch: #1E6B45; --pitch-deep: #164F34; --on-pitch: #F3F6F4;
  --card: #F5C518; --on-card: #10233A;
  --warn: #9A5B00; --warn-bg: #FFF1D6; --ok: #1E6B45;
  --tile-a: #E3EDE7; --tile-b: #E6EAF1; --tile-c: #F1ECDD; --focus: #1F5FBF;
  --display: "Karantina", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --tabs-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chalk: #0E1914; --surface: #15231C; --ink: #E5EEE9; --muted: #98ABA2; --rule: #2A3D33;
    --pitch: #1B5E3D; --pitch-deep: #123F29; --on-pitch: #EEF4F0; --card: #F2C62B; --on-card: #10233A;
    --warn: #FFC56B; --warn-bg: #3A2A10; --ok: #6FD39C;
    --tile-a: #1C2E25; --tile-b: #1D2633; --tile-c: #2A2719; --focus: #7FB2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chalk: #0E1914; --surface: #15231C; --ink: #E5EEE9; --muted: #98ABA2; --rule: #2A3D33;
  --pitch: #1B5E3D; --pitch-deep: #123F29; --on-pitch: #EEF4F0; --card: #F2C62B; --on-card: #10233A;
  --warn: #FFC56B; --warn-bg: #3A2A10; --ok: #6FD39C;
  --tile-a: #1C2E25; --tile-b: #1D2633; --tile-c: #2A2719; --focus: #7FB2FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--chalk); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--pitch-deep); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 520px; margin-inline: auto; min-height: 100%; display: flex; flex-direction: column; background: var(--chalk); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--pitch-deep); color: var(--on-pitch);
  display: flex; align-items: center; gap: 10px; min-height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar h1 { font-family: var(--display); font-size: 2rem; font-weight: 700; line-height: 1; }
.bar .tools { margin-inline-start: auto; display: flex; gap: 6px; }
.seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--on-pitch) 35%, transparent); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 9px; cursor: pointer; font-size: .82rem; color: var(--on-pitch); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--on-pitch); color: var(--pitch-deep); font-weight: 600; }

main {
  flex: 1; padding-block: 18px calc(var(--tabs-h) + 24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen-title { font-family: var(--display); font-size: 2.6rem; line-height: 1; font-weight: 700; }
.screen-sub { color: var(--muted); margin-top: 4px; font-size: .95rem; }
.stack { display: grid; gap: 14px; margin-top: 18px; }

/* Kids */
.kid { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; }
.kid[aria-current="true"] { border-color: var(--pitch); box-shadow: inset 0 0 0 1px var(--pitch); }
.kid .nm { font-weight: 600; font-size: 1.1rem; }
.kid .meta { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.kid .eu { grid-row: span 2; font-family: var(--display); font-size: 3.4rem; line-height: .85; font-weight: 700; color: var(--pitch); font-variant-numeric: tabular-nums; text-align: end; }
.kid .eu small { display: block; font-family: var(--body); font-size: .72rem; color: var(--muted); font-weight: 500; }
.kid .due { grid-column: 1 / -1; font-size: .85rem; padding: 6px 10px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); }
.kid .acts { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.example { font-size: .78rem; color: var(--muted); }

.btn { border: 0; border-radius: 6px; padding: 10px 16px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn-pitch { background: var(--pitch); color: var(--on-pitch); }
.btn-card { background: var(--card); color: var(--on-card); }
.btn-line { background: none; border: 1px solid var(--rule); color: var(--ink); }
.btn-block { width: 100%; }

/* Measure sheet */
.sheet-scrim { position: fixed; inset: 0; background: rgb(8 18 14 / .55); z-index: 40; }
.sheet {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 41; max-width: 520px; margin-inline: auto;
  background: var(--surface); border-top: 1px solid var(--rule); border-radius: 12px 12px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  max-height: 92%; overflow-y: auto;
}
.sheet h2 { font-family: var(--display); font-size: 2.2rem; line-height: 1; }
.sheet .how { color: var(--muted); font-size: .9rem; margin-top: 6px; }
.field { display: grid; gap: 6px; margin-top: 16px; }
.field label { font-weight: 600; font-size: .92rem; }
.field input[type=text], .field input[type=number] { padding: 10px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--chalk); min-height: 44px; }
.field .err { color: var(--warn); font-size: .85rem; }
.ruler { margin-top: 10px; direction: ltr; background: var(--pitch); color: var(--on-pitch); border-radius: 6px; padding: 10px 8px 4px; }
.ruler svg { width: 100%; height: auto; display: block; }
.range-row { display: flex; gap: 10px; align-items: center; direction: ltr; }
.range-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--pitch); height: 32px; }
.range-row input[type=number] { width: 5.5rem; text-align: center; font-variant-numeric: tabular-nums; }
.live { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; }
.live b { font-family: var(--display); font-size: 3rem; line-height: .9; color: var(--pitch); font-variant-numeric: tabular-nums; }
.live span { color: var(--muted); font-size: .9rem; }
.sheet .acts { display: flex; gap: 10px; margin-top: 18px; }
.sheet .acts .btn { flex: 1; }

/* Shop */
.who { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; padding-bottom: 4px; scrollbar-width: none; }
.who button { flex: none; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 7px 12px; cursor: pointer; min-height: 40px; font-size: .9rem; }
.who button[aria-pressed="true"] { background: var(--ink); color: var(--chalk); border-color: var(--ink); }
.list { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 0; border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.row .tile { width: 92px; aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center; max-width: 100%; }
.row .tile svg { width: 78%; height: auto; color: var(--ink); }
.row .info { min-width: 0; display: grid; gap: 4px; }
.row h3 { font-size: 1rem; font-weight: 600; line-height: 1.35; }
.row .spec { color: var(--muted); font-size: .86rem; font-variant-numeric: tabular-nums; }
.row .buy { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
.row .price { font-weight: 600; font-variant-numeric: tabular-nums; }
.row select { flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); min-height: 40px; }
.row .add { background: var(--pitch); color: var(--on-pitch); border: 0; border-radius: 6px; padding: 8px 12px; font-weight: 600; cursor: pointer; min-height: 40px; white-space: nowrap; }
.row .add[data-done="true"] { background: var(--ink); color: var(--chalk); }
.fitline { color: var(--ok); font-size: .82rem; font-weight: 600; }

/* Cart + orders */
.lines { list-style: none; padding: 0; margin: 16px 0 0; border-top: 1px solid var(--rule); }
.lines li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: center; }
.lines .nm { font-weight: 600; min-width: 0; }
.lines .meta { color: var(--muted); font-size: .86rem; }
.lines .lp { font-weight: 600; font-variant-numeric: tabular-nums; }
.qty { display: inline-flex; align-items: center; gap: 8px; }
.qty button { width: 36px; height: 36px; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; cursor: pointer; }
.qty span { min-width: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 600; margin-top: 16px; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: .86rem; margin-top: 4px; }
.notice { font-size: .88rem; background: var(--tile-c); padding: 10px 12px; border-radius: 6px; margin-top: 12px; }
.empty { margin-top: 24px; display: grid; gap: 12px; justify-items: start; color: var(--muted); }
.order { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; margin-top: 16px; }
.order header { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.order header b { font-variant-numeric: tabular-nums; }
.status { font-size: .85rem; font-weight: 600; color: var(--ok); }
.status[data-s="swap"] { color: var(--warn); }
.swap-form { display: grid; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); }
.swap-form select { padding: 9px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); min-height: 44px; }

/* Tabs */
.tabs {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabs nav { max-width: 520px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabs-h); }
.tabs button { background: none; border: 0; cursor: pointer; display: grid; place-items: center; gap: 0; padding: 6px 0; color: var(--muted); font-size: .74rem; position: relative; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--pitch); font-weight: 600; }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; inset-inline: 28%; height: 3px; background: var(--pitch); border-radius: 0 0 3px 3px; }
.badge { position: absolute; top: 6px; inset-inline-end: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--card); color: var(--on-card); font-size: .7rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.toast { position: fixed; inset-inline: 16px; bottom: calc(var(--tabs-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 35; max-width: 488px; margin-inline: auto; background: var(--ink); color: var(--chalk); padding: 12px 14px; border-radius: 6px; font-size: .92rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<div class="tabs">

    <button type="button" data-tab="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h13l-3-3M20 15H7l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="tabOrders"></span></button>

    if (e.target.id === "measure-form") {
      var today = new Date().toISOString().slice(0, 10);
      if (sheetKid) { sheetKid.foot = sheetFoot; sheetKid.date = today; sheetKid.example = false; var nm = kidName(sheetKid); }
      else {
        var input = $("#kid-name"), name = input.value.trim();
        if (!name) { $("#name-err").hidden = false; input.setAttribute("aria-invalid", "true"); input.focus(); return; }
        var k = { id: "k" + Date.now(), name: name, foot: sheetFoot, date: today };
        state.kids.push(k); state.activeKid = k.id; nm = name;
      }
      save(); closeSheet(); render(); toast(t("saved")(nm)); return;
    }
    var oid = e.target.getAttribute("data-swapform");
    if (oid) {
      var o = state.orders.filter(function (x) { return x.id === oid; })[0], ns = $("#swap-" + oid).value;
      o.swap = ns; state.swapOpen = null; save(); render(); toast(t("swapDone")(ns));
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "foot-range") setFoot(e.target.value, "r");
    if (e.target.id === "kid-name" && e.target.value.trim()) { $("#name-err").hidden = true; e.target.removeAttribute("aria-invalid"); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "foot-num") setFoot(e.target.value, "n");
    if (e.target.hasAttribute && e.target.hasAttribute("data-size") && e.target.tagName === "SELECT") {
      var row = e.target.closest(".row"), p = byId(row.getAttribute("data-id")), z = p.sizes.filter(function (x) { return x.s === e.target.value; })[0];
      row.querySelector("[data-spec]").textContent = specFor(p, z);
    }
  });
  document.addEventListener("focusout", function (e) {
    if (e.target.id === "kid-name" && !e.target.value.trim() && e.relatedTarget && e.relatedTarget.id !== "sheet-cancel") { $("#name-err").hidden = false; e.target.setAttribute("aria-invalid", "true"); }
  });
  document.addEventListener("keydown", function (e) {
    if ($("#sheet").hidden) return;
    if (e.key === "Escape") { closeSheet(); return; }
    if (e.key === "Tab") {
      var f = $$("button, input, select", $("#sheet")).filter(function (x) { return x.offsetParent !== null && x.type !== "hidden"; });
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (["kids", "shop", "cart", "orders"].indexOf(h) >= 0 && h !== state.tab) { state.tab = h; render(true); } });

  var start = location.hash.slice(1);
  if (["kids", "shop", "cart", "orders"].indexOf(start) >= 0) state.tab = start;
  render();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
